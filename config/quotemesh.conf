# QuoteMesh aggregator configuration (key = value, '#' starts a comment).
# Any key can also be overridden on the command line with --set key=value.

# --- shared memory distribution -------------------------------------------
shm.name           = /quotemesh      # overridable via QUOTEMESH_SHM_NAME
shm.ring_capacity  = 65536           # power of two, 64 bytes per slot
shm.max_symbols    = 4096
shm.lock_pages     = false           # mlock the segment (may need raised RLIMIT_MEMLOCK)

# --- threading ---------------------------------------------------------------
aggregator.cpu        = -1           # pin aggregator thread (Linux only), -1 = no pinning
aggregator.busy_poll  = true
aggregator.forward_venue_quotes = false
feed.first_cpu        = -1           # feed i pinned to first_cpu + i
feed.busy_poll        = false
feed.simd             = true         # false = scalar reference parser
feed.queue_capacity   = 65536

# --- synthetic feed generator -------------------------------------------------
synthetic.rate        = 20000        # messages / second / exchange
synthetic.trade_ratio = 0.1
synthetic.drop_ratio  = 0.0001       # simulated packet loss, exercises gap detection

stats.interval_ms = 1000

symbols = AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,SPY,QQQ,IWM,AMD,NFLX,JPM,XOM,BAC,INTC,DIS,KO,PEP,COST

# --- exchanges -------------------------------------------------------------------
# exchange.<id> = <NAME> synthetic | udp:<port> | udp:<bind_host>:<port> | mcast:<group>:<port>
exchange.0  = NYSE   synthetic
exchange.1  = NASDAQ synthetic
exchange.2  = ARCA   synthetic
exchange.3  = BATS   synthetic
exchange.4  = BATY   synthetic
exchange.5  = EDGA   synthetic
exchange.6  = EDGX   synthetic
exchange.7  = IEX    synthetic
exchange.8  = MEMX   synthetic
exchange.9  = MIAX   synthetic
exchange.10 = LTSE   synthetic
exchange.11 = AMEX   synthetic
exchange.12 = PHLX   synthetic
exchange.13 = BX     synthetic
exchange.14 = CHX    synthetic
exchange.15 = NSX    synthetic
